name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release metadata
        run: npm run verify:release-metadata
      - name: Run tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build release asset
        run: npm run build
